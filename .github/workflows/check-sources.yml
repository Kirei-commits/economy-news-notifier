name: Check RSS Sources

on:
  schedule:
    - cron: "0 3 * * 1" # 毎週月曜 12:00 JST
  workflow_dispatch: {}
  pull_request:
    paths:
      - "src/sources.ts"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run check-sources
